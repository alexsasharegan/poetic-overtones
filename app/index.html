<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poetic Overtones</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>Poetic Overtones</h1>
  <div class="tools">
    <label>Sample <select id="samples">
      <option value="">Twinkle (layers)</option>
      <option value="../themes/community-demo.pxml">Community theme demo</option>
      <option value="../demo/sonnet18.pxml">Sonnet 18 (full demo)</option>
    </select></label>
    <label class="button">Open<input id="open" type="file" accept=".pxml,.xml,text/xml" hidden></label>
    <button id="save">Save</button>
    <button id="print" title="Print, or save as PDF from the print dialog">Print / PDF</button>
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <label>Theme <select id="theme"></select></label>
    <label><select id="add-theme" aria-label="Add a built-in theme">
      <option value="">Add theme…</option>
      <option value="Community">Community (Phonetic Markup for Verse)</option>
      <option value="Plain">Plain</option>
    </select></label>
  </div>
</header>
<main>
  <section class="page">
    <h2 id="doc-title"></h2>
    <div id="poem"></div>
    <p id="credit"></p>
    <p id="status" role="status"></p>
  </section>
  <aside>
    <h2>Tiers <small>top of the list is the top layer</small></h2>
    <ol id="tiers"></ol>
    <form id="new-tier" class="inline">
      <input name="name" placeholder="New tier name" required>
      <input name="role" placeholder="role" pattern="[a-z][a-z0-9_\-]*" size="9">
      <label><input type="checkbox" name="relation"> relation</label>
      <button>Add tier</button>
    </form>
    <form id="new-standard" class="inline">
      <select name="ref" aria-label="Standard tier">
        <option value="text.line@1">Lines</option>
        <option value="text.stanza@1">Stanzas</option>
        <option value="english.word@1">Words (English)</option>
      </select>
      <button>Add standard tier</button>
    </form>
    <div id="sets"></div>
  </aside>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
